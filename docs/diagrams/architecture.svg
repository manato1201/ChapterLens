<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 1000" width="1640" role="img" aria-labelledby="t d"><title id="t">ChapterLens の全体の構成</title><desc id="d">ブラウザの拡張(目次の画面・背景・音声の取り込み)が、この PC の中のエンジン(127.0.0.1)と通信する。字幕から作る処理は拡張の中だけで完結し、音声・ライブ・共有はエンジンを使う。CLI は管理と書き出しに使う。</desc><style>
