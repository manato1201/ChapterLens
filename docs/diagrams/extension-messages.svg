ono" x="1465" y="511.0">/v1/transcribe</text><text class="sub mono" x="1465" y="526.0">/v1/live /v1/shares</text><rect class="lab" x="185.2" y="129.0" width="229.6" height="16" rx="3"/><text class="alabel mono blue" x="300.0" y="141.0">start {streamId, serverUrl, token}</text><rect class="lab" x="416.8" y="419.0" width="184.4" height="16" rx="3"/><text class="alabel mono blue" x="509.0" y="431.0">engine {method, path, body}</text><rect class="lab" x="450.1" y="477.0" width="157.9" height="16" rx="3"/><text class="alabel mono blue" x="529.0" y="489.0">engine / stop  ⇄  cl-*</text><rect class="lab" x="945.5" y="419.0" width="234.1" height="16" rx="3"/><text class="alabel mono blue" x="1062.5" y="431.0">fetch(Bearer token・127.0.0.1 だけ)</text><rect class="lab" x="866.2" y="184.0" width="145.7" height="16" rx="3"/><text class="alabel mono blue" x="939.0" y="196.0">start / stop / status</text><rect class="lab" x="783.9" y="244.0" width="210.3" height="16" rx="3"/><text class="alabel mono " x="889.0" y="256.0">relay {tabId, payload: cl-cues}</text><rect class="lab" x="1181.9" y="199.0" width="203.1" height="16" rx="3"/><text class="alabel mono orange" x="1283.5" y="211.0">POST /v1/transcribe(WAV 30 秒)</text><text class="hd" x="40" y="44" text-anchor="start">拡張(extension/src)のメッセージの経路</text><text class="note" x="40" y="66" text-anchor="start">fetch は background(エンジン API の中継)と offscreen(音声)だけ。画面と content script は直接送らない</text><text class="note" x="40" y="880" text-anchor="start">cl-started / cl-cues / cl-status / cl-error / cl-ended は、background → content script(chrome.tabs.sendMessage)</text></svg>
