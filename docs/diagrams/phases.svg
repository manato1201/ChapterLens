t><text class="sub mono" x="1503" y="305.0">EDL・字幕</text><text class="sub mono" x="1503" y="320.0">縦動画(--own)</text><text class="hd" x="40" y="44" text-anchor="start">段階(CH0〜CH6)の機能の地図</text><text class="note" x="40" y="66" text-anchor="start">すべて実装済み。実際の Chrome・本物のライブ配信での確認は、利用者の操作で行う</text><rect x="140.0" y="181" width="58.0" height="18" rx="9" fill="var(--teal)"/><text class="badge" x="169" y="194">実装済</text><rect x="368.0" y="181" width="58.0" height="18" rx="9" fill="var(--teal)"/><text class="badge" x="397" y="194">実装済</text><rect x="596.0" y="181" width="58.0" height="18" rx="9" fill="var(--teal)"/><text class="badge" x="625" y="194">実装済</text><rect x="824.0" y="181" width="58.0" height="18" rx="9" fill="var(--teal)"/><text class="badge" x="853" y="194">実装済</text><rect x="1052.0" y="181" width="58.0" height="18" rx="9" fill="var(--teal)"/><text class="badge" x="1081" y="194">実装済</text><rect x="1280.0" y="181" width="58.0" height="18" rx="9" fill="var(--teal)"/><text class="badge" x="1309" y="194">実装済</text><rect x="1508.0" y="181" width="58.0" height="18" rx="9" fill="var(--teal)"/><text class="badge" x="1537" y="194">実装済</text><text class="note" x="80" y="420" text-anchor="start">CH3b: 拡張の共有・管理の画面と、章の調整(拡張側)  ·  土台の考え方: 先に「測れる」ようにしてから作る(CH0)</text></svg>
