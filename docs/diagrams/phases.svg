<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 520" width="1640" role="img" aria-labelledby="t d"><title id="t">段階ごとの機能の地図</title><desc id="d">CH0 の測る土台から CH6 の書き出しまで、各段階で追加した機能。</desc><style>
:root{--bg:#ffffff;--grid:#edf0f4;--ink:#1d2433;--muted:#667085;--card:#ffffff;--cardline:#d0d5dd;--lab:#ffffff;
