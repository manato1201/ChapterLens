<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 980" width="1640" role="img" aria-labelledby="t d"><title id="t">エンジンのモジュールの層</title><desc id="d">上の層ほど利用者に近い。CLI と道具が、評価とサーバーを呼び、どちらも核(検出・ライブ・ダイジェスト・音声認識)を使う。</desc><style>
